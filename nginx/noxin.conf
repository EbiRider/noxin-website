# /etc/nginx/sites-available/noxin
# Symlink to enable: sudo ln -s /etc/nginx/sites-available/noxin /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name noxin.ir www.noxin.ir;

    # Certbot will modify this block to redirect HTTP → HTTPS
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets from Next.js
    location /_next/static/ {
        proxy_pass       http://localhost:3000;
        proxy_cache_valid 200 1y;
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve public files directly
    location /public/ {
        proxy_pass http://localhost:3000;
    }

    # Gzip
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    client_max_body_size 10M;
}
