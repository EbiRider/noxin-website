name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar -czf /tmp/noxin-deploy.tar.gz --exclude=./node_modules --exclude=./.next --exclude=./.git .
          cp /tmp/noxin-deploy.tar.gz noxin-deploy.tar.gz

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: noxin-deploy.tar.gz
          target: /tmp/

      - name: Extract, build and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            tar -xzf /tmp/noxin-website/noxin-deploy.tar.gz -C /var/www/noxin
            rm -rf /tmp/noxin-website
            cd /var/www/noxin
            npm ci
            npm run build
            pm2 restart noxin --update-env
            pm2 save
